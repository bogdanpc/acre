name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (for example 1.0.0)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Stamp the version into the pom
        run: mvn -B --no-transfer-progress versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Make a fixed-name copy for JBang
        run: cp target/acre-${{ steps.version.outputs.version }}.jar target/acre.jar

      - name: Attest the jar
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: target/acre-${{ steps.version.outputs.version }}.jar

      - name: Release
        run: mvn -B --no-transfer-progress jreleaser:full-release -Dgithub.owner=${{ github.repository_owner }}
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the JReleaser log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-log
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties
